name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            asset: codag-drain_darwin_arm64
          # Intel Mac builds paused; preserve the lane for explicit reactivation.
          # - os: blacksmith-6vcpu-macos-15
          #   target: x86_64-apple-darwin
          #   asset: codag-drain_darwin_amd64
          # glibc-linked build: linking on 22.04 (glibc 2.35) caps the binary's
          # glibc requirement at 2.35; a 24.04 host would allow up to 2.39.
          - os: blacksmith-4vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            asset: codag-drain_linux_amd64
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            asset: codag-drain_windows_amd64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p codag-drain --target ${{ matrix.target }}
      - name: Stage asset (posix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/codag-drain" "${{ matrix.asset }}"
          strip "${{ matrix.asset }}" || true
          chmod 755 "${{ matrix.asset }}"
      - name: Stage asset (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "target/${{ matrix.target }}/release/codag-drain.exe" "${{ matrix.asset }}"
      - name: Smoke test (native archs only)
        if: matrix.target != 'aarch64-apple-darwin' || runner.os == 'macOS'
        shell: bash
        run: printf 'worker ready shard=1\nworker ready shard=2\n' | "./${{ matrix.asset }}" --stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          shasum -a 256 codag-drain_* > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "codag-drain ${GITHUB_REF_NAME}" \
            --notes "Neotask build of codag-drain (MIT). Static per-platform binaries for the Neotask log-lens gateway plugin. Upstream: codag-megalith/codag-drain @ 5a84fb050e074b15474fdb264c9e97faaa66c9f5."
